name: Build Eureka Kernel - A205F

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Eureka A205F
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Eureka Kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gawk \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Prepare toolchain
        run: |
          set -e

          if [ -x "toolchain/bin/clang-14" ] || [ -x "toolchain/bin/clang-13" ]; then
            echo "Existing Eureka toolchain found."
          else
            echo "Downloading Eureka-compatible Vortex Clang..."
            rm -rf toolchain

            git clone --depth=1 \
              https://github.com/vijaymalav564/vortex-clang.git \
              toolchain
          fi

          chmod +x toolchain/bin/* 2>/dev/null || true

          echo "===== CLANG ====="
          toolchain/bin/clang --version || true

          echo "===== AARCH64 GCC ====="
          toolchain/bin/aarch64-linux-gnu-gcc --version || true

      - name: Verify Eureka source
        run: |
          set -e

          echo "===== SOURCE ====="
          pwd

          echo "===== DEFCONFIG ====="
          test -f arch/arm64/configs/exynos7885-a20_defconfig
          echo "A205 defconfig found."

          echo "===== ANYKERNEL ====="
          test -d kernel_zip/anykernel
          echo "AnyKernel directory found."

          echo "===== KERNELSU ====="
          test -d KernelSU
          echo "KernelSU directory found."

      - name: Inject Android 17 Configs
        run: |
          cat << 'EOF' >> arch/arm64/configs/exynos7885-a20_defconfig
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_EXT4_FS=y
          CONFIG_DEVPTS_FS=y
          CONFIG_USERFAULTFD=y
          CONFIG_AUDIT=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          EOF


      - name: Build A205F
        run: |
          set -e

          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=r
          export PLATFORM_VERSION=11

          export KBUILD_BUILD_USER=Eureka-GitHub
          export KBUILD_BUILD_HOST=github-actions

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabi-"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          export CORES="$(nproc)"

          echo "=========================================="
          echo "        EUREKA KERNEL - SM-A205F"
          echo "=========================================="
          echo "ARCH: $ARCH"
          echo "ANDROID: $ANDROID_MAJOR_VERSION"
          echo "PLATFORM: $PLATFORM_VERSION"
          echo "JOBS: $CORES"
          echo "DEFCONFIG: exynos7885-a20_defconfig"
          echo "=========================================="

          rm -rf out

          echo
          echo "===== DEFCONFIG ====="

          make \
            O=out \
            ARCH=arm64 \
            ANDROID_MAJOR_VERSION=r \
            exynos7885-a20_defconfig

          echo
          echo "===== CONFIG CHECK ====="

          grep -E \
            'CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS' \
            out/.config || true

          echo
          echo "===== BUILD ====="

          make \
            -j"$CORES" \
            O=out \
            ARCH=arm64 \
            ANDROID_MAJOR_VERSION=r \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            LOCALVERSION=-Eureka \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify kernel output
        run: |
          set -e

          echo "===== KERNEL OUTPUT ====="
          ls -lah out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image

          echo
          echo "Image:"
          ls -lh out/arch/arm64/boot/Image

          echo
          echo "DTB:"
          ls -lh out/arch/arm64/boot/dtb.img || true

          echo
          echo "DTBO:"
          ls -lh out/arch/arm64/boot/dtbo.img || true

      - name: Prepare AnyKernel package
        run: |
          set -e

          echo "===== PREPARING ANYKERNEL ====="

          cp -f \
            out/arch/arm64/boot/Image \
            arch/arm64/boot/Image

          cp -f \
            out/arch/arm64/boot/dtb.img \
            arch/arm64/boot/dtb.img

          cp -f \
            out/arch/arm64/boot/dtbo.img \
            arch/arm64/boot/dtbo.img

          cp -f \
            out/arch/arm64/boot/Image \
            kernel_zip/anykernel/Image

          cp -f \
            out/arch/arm64/boot/dtb.img \
            kernel_zip/anykernel/dtb.img

          cp -f \
            out/arch/arm64/boot/dtbo.img \
            kernel_zip/anykernel/dtbo.img

          echo
          echo "===== ANYKERNEL CONTENT ====="
          ls -lh kernel_zip/anykernel/Image
          ls -lh kernel_zip/anykernel/dtb.img
          ls -lh kernel_zip/anykernel/dtbo.img

      - name: Create A205F ZIP
        run: |
          set -e

          cd kernel_zip/anykernel

          ZIP_NAME="Eureka_A205F_GitHub.zip"

          zip -r -9 \
            "../../../$ZIP_NAME" \
            . \
            -x "*.git*" \
            -x "*README*" \
            -x "*.md"

          cd ../../../

          echo "===== FINAL ZIP ====="
          ls -lh Eureka_A205F_GitHub.zip

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Eureka-A205F-Kernel
          path: |
            Eureka_A205F_GitHub.zip
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
          if-no-files-found: error